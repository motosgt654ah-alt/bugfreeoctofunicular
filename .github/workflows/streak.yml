name: Executar Contador de Streak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências do sistema e Kivy
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dev libgles2-mesa-dev
          python -m pip install --upgrade pip
          pip install kivy

      - name: Rodar o script do contador
        run: |
          xvfb-run python contador.py
          
