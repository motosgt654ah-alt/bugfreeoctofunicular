name: Executar Contador de Streak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Rodar o script do contador
      run: |
        pip install kivy
        python contador.py
        
